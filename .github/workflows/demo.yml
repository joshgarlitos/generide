name: Browser demo

# Builds the in-browser page (demo/), tests it in headless Chromium, and on
# main publishes it to GitHub Pages. The deploy runs only when every check
# passed, so a failing push leaves the last good page live (plan R12, KTD8).
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The slower smoke case's time on this runner (27.0 s) plus 50%
      # (docs/devlog.md, 2026-10-03).
      DEMO_TIME_LIMIT: "41"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: pip install -r requirements.txt
      - run: pytest
      - run: npm ci --prefix demo
      - name: Install Chromium for Playwright
        working-directory: demo
        run: npx playwright install --with-deps chromium
      - run: python tools/build_demo.py
      - name: Browser tests and timed smoke runs
        working-directory: demo
        run: npx playwright test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
