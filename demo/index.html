<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Evolve a RollerCoaster Tycoon 2 Mine Train in your browser with generide. Nothing to install.">
  <title>generide: evolve a coaster in your browser</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="demo.css">
  <script src="iso-view.js"></script>
  <script src="app.js" type="module"></script>
</head>
<body class="desktop">
  <header class="top c-grey outset">
    <nav class="toolbar" aria-label="Main">
      <span class="brand">generide</span>
      <div class="toolgroup c-bordeaux">
        <a class="button" href="https://github.com/joshgarlitos/generide">Source on GitHub</a>
      </div>
    </nav>
  </header>
  <main id="view" tabindex="-1">
    <section class="win c-grey">
      <h1 class="win-caption">generide</h1>
      <div class="win-body"><p>Loading…</p></div>
    </section>
  </main>
  <noscript>
    <div class="noscript">
      <section class="win c-bordeaux prompt">
        <h1 class="win-caption">JavaScript is off</h1>
        <div class="win-body">
          <p>This page runs generide in your browser, which needs JavaScript turned on.</p>
          <p><a href="https://github.com/joshgarlitos/generide">See generide on GitHub</a>.</p>
        </div>
      </section>
    </div>
  </noscript>
  <footer class="foot">
    <div class="statusbar c-darkgreen outset">
      <span>Runs entirely in your browser. Nothing is sent anywhere.</span>
    </div>
  </footer>
</body>
</html>
